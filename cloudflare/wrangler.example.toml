name = "schnapper-agent-team"
main = "src/worker.mjs"
compatibility_date = "2026-10-22"
workers_dev = false

# NO schedules deployed by default. Add "17 * * * *" only after verification.
[triggers]
crons = []

[vars]
RUN_ENABLED = "false"
ACCOUNT_FREE_PLAN_CONFIRMED = "no"
COST_POLICY = "free-only"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "schnapper-agent-reports"
database_id = "REPLACE_WITH_FREE_D1_DATABASE_ID"
