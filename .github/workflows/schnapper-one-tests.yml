name: SCHNAPPER ONE – Offline-Tests
on:
  pull_request:
    paths:
      - 'schnapper_one/**'
      - '.github/workflows/schnapper-one-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests ohne KI-/Netz-/Zahlungszugriff
        working-directory: schnapper_one
        env:
          SCHNAPPER_ONE_KI_ENABLED: 'false'
          GITHUB_TOKEN: ''
        run: python -m unittest discover -s tests -v
