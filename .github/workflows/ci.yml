name: SCHNAPPER ONE – unabhängige Offline-Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 6 Offline-/Sicherheitstests, ohne echte KI
        env:
          SCHNAPPER_ONE_KI_ENABLED: 'false'
          GITHUB_TOKEN: ''
        run: python -m unittest discover -s tests -v
