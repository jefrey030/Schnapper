name: SCHNAPPER Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    # Kostenschutz: nur in öffentlichem Repository (kostenlose Standard-Runner)
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Python Unit-Tests
        run: python -m unittest discover -s tests -v

  cloudflare-tests:
    # Nur Standard-Runner im öffentlichen Repository; keine Workers-Bereitstellung.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Cloudflare Worker Offline-Tests (ohne Deployment)
        working-directory: cloudflare
        run: node --test test/*.test.mjs
