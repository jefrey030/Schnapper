name: SCHNAPPER Stundenlauf
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schnapper-hourly
  cancel-in-progress: false
jobs:
  four-agent-run:
    # Keine GitHub-Cloud-Minuten: eigener Rechner mit Ollama und Runner erforderlich.
    runs-on: [self-hosted, schnapper]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vier lokale Modellrollen und Python-Tests
        run: python team/runner.py
      - name: Berichte speichern, auch wenn das Modell fehlt
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team/STATUS.md team/runs/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: SCHNAPPER lokaler KI-Stundenbericht'
            git push
          fi
