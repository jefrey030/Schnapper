name: SCHNAPPER Stundenlauf
# Vier getrennte KI-Agenten (LEAD, BRAIN, CHECK, COMMAND), jeder als eigener
# Schritt/Prozess mit eigener Anfrage an GitHub Models (kostenloses Kontingent).
# Kostenbremsen: ein Job pro Stunde, Zeitlimit 10 Min., max. 6 KI-Aufrufe pro
# Lauf, kein Geheimnis/API-Schlüssel nötig, Not-Aus über Repo-Variable
# SCHNAPPER_PAUSE=true (Settings > Secrets and variables > Actions > Variables).
# KOSTENSCHUTZ: Der Job startet nur, wenn das Repository ÖFFENTLICH ist
# (dort sind Standard-Runner kostenlos). Bei einem privaten Repo wird er
# übersprungen und verbraucht keine Minuten – auch wenn ein Budget existiert.
# Fail-Closed: Fehlende Sichtbarkeit darf nicht per GitHub-Typumwandlung
# als false gelten; toJSON() unterscheidet null von false.
# Kein Job bei privat oder fehlender Repository-Sichtbarkeitsangabe.
# Zusätzlich ist die ausdrückliche Freischaltung SCHNAPPER_OEFFENTLICH=true
# nötig. Ein gesetztes Flag allein darf die Privat-Repo-Sperre nie umgehen.
# Der erste Runner-Schritt prüft die Sichtbarkeit noch einmal unabhängig.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # nur zum Speichern der Berichte unter team/
  models: read      # GitHub Models mit dem automatischen GITHUB_TOKEN

concurrency:
  group: schnapper-hourly
  cancel-in-progress: false

jobs:
  ki-team:
    if: >-
      github.repository == 'jefrey030/schnapper' && vars.SCHNAPPER_PAUSE != 'true' &&
      vars.SCHNAPPER_OEFFENTLICH == 'true' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCHNAPPER_MODELL: ${{ vars.SCHNAPPER_MODELL }}
      SCHNAPPER_MAX_AUFRUFE: '6'
    steps:
      - name: Kostenschutz – nur öffentliches Repository
        run: |
          privat=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["private"])')
          if [ "$privat" != "False" ]; then echo "Repository ist privat – Abbruch, damit keine Kosten entstehen." >&2; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Laufordner anlegen
        run: echo "LAUF=team/work/$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
      - name: Agent LEAD – plant und verteilt
        run: python team/agent.py LEAD "$LAUF"
      - name: Agent BRAIN – analysiert und entwickelt Vorschlag
        run: python team/agent.py BRAIN "$LAUF"
      - name: Agent CHECK – Tests, Sicherheits-Scan, Prüfung
        run: python team/agent.py CHECK "$LAUF"
      - name: Agent COMMAND – koordiniert und protokolliert
        run: python team/agent.py COMMAND "$LAUF"
      - name: Stundenbericht erstellen
        if: always()
        run: python team/agent.py BERICHT "$LAUF"
      - name: Berichte speichern
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team/STATUS.md team/runs/ team/proposals/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -m "SCHNAPPER KI-Team: Stundenbericht ${LAUF##*/}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Push fehlgeschlagen" >&2; exit 1
