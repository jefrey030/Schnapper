name: SCHNAPPER Legacy-KI (aus Sicherheitsgründen stillgelegt)
# Das stündliche Legacy-GitHub-Models-System ist dauerhaft deaktiviert.
# Keine Cron-Ausführung, kein Modelleinsatz, keine Workflow-Schreibrechte.
# Lokale Ollama-Tests finden NICHT in GitHub-hosted Actions statt.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Legacy-Dienst gesperrt
        run: echo 'Der Legacy-KI-Lauf ist stillgelegt; es wurde keine KI gestartet.'
