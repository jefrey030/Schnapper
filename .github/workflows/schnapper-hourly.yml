name: SCHNAPPER Stundenlauf
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schnapper-hourly
  cancel-in-progress: false
jobs:
  four-agent-run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: LEAD BRAIN CHECK COMMAND ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHNAPPER_AI_ENABLED: ${{ vars.SCHNAPPER_AI_ENABLED }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python team/runner.py
      - name: Berichte dauerhaft ablegen
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team/STATUS.md team/runs/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: SCHNAPPER Stundenbericht'
            git push
          fi
