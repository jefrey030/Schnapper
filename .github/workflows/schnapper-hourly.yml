name: SCHNAPPER KI-Stundenlauf (stillgelegt)
# MASTER 90: sichere Zusammenführung der Gate-Anforderungen aus PR #21 und #53.
# Keine Automatik, keine Inferenz, kein Berichtsschreibzugriff, keine Provider-Tokens.
# Wiedereinschaltung nur in eigenem, unabhängig geprüftem Freigabe-PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ki-team:
    # Zweifaches NO-GO: kein Event-Zeitplan und nie wahrer Job-Guard.
    if: >-
      false &&
      github.repository == 'jefrey030/schnapper' &&
      vars.SCHNAPPER_PAUSE != 'true' &&
      vars.SCHNAPPER_OEFFENTLICH == 'true' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Stillgelegt - kein KI-Aufruf
        run: |
          echo "NO-GO: Sicherheits- und Modellsysteme nicht freigegeben."
